name: Deploy and Remote Quality Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tepid-h1-zero-gpu-deployment
  cancel-in-progress: false

jobs:
  deploy-refresh-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deployment client
        run: python -m pip install "huggingface_hub>=1.4,<2" "gradio_client>=2,<3" "requests>=2,<3"
      - name: Deploy, refresh Dev Mode and run ZeroGPU quality gate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          CORE_REVISION: ${{ github.sha }}
          QUALITY_REPORT_PATH: ${{ runner.temp }}/zero-gpu-quality-report.json
        run: python .github/scripts/deploy_zero_gpu.py
      - name: Upload remote quality report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zero-gpu-quality-report-${{ github.sha }}
          path: ${{ runner.temp }}/zero-gpu-quality-report.json
          if-no-files-found: warn
          retention-days: 30
