name: Tepid-H1 Quality Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reference-framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: tepid-h1 data-audit configs/data_inventory.example.json
      - run: >-
          tepid-h1 decontaminate
          --training configs/decontamination_training.example.jsonl
          --benchmark configs/decontamination_benchmark.example.jsonl
