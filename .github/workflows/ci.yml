name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install coverage

      - name: Run tests with coverage
        run: pytest tests/ -q --tb=short

      - name: Generate coverage report
        run: coverage run -m pytest tests/ -q && coverage report --show-missing

      - name: Type checking
        run: mypy src/tepid_h1 --ignore-missing-imports

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Format check with ruff
        run: ruff check src/ tests/ examples/

      - name: Check diff
        run: git diff --check

  stage-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate M0 data audit
        run: python -m tepid_h1.cli data-audit configs/data_inventory.example.json

      - name: Validate M0 tokenizer benchmark
        run: python -m tepid_h1.cli tokenizer-benchmark --corpus configs/paired_corpus.example.jsonl --candidate 64000=configs/data_inventory.example.json

      - name: Validate M1 delta backend
        run: python -m tepid_h1.cli delta-validate --backend eager --device cpu --sequence-length 16 --iterations 1 --skip-gradients

      - name: Validate M1 retrieval suite
        run: python -m tepid_h1.cli retrieval-generate --prompts /tmp/retrieval-prompts.jsonl --answers /tmp/retrieval-answers.jsonl --length 64 --length 128 --position 0.5 --seed 42

      - name: Validate M1 baseline
        run: python -m tepid_h1.cli baseline-report --variant prototype

      - name: Validate M2 training smoke
        run: python -m tepid_h1.cli train-smoke --steps 1

      - name: Validate M2 compare smoke
        run: python -m tepid_h1.cli compare-smoke --steps 1 --trials 1 --device cpu --dtype float32 --corpus configs/paired_corpus.example.jsonl --inventory configs/data_inventory.example.json

      - name: Validate M3 agent demo
        run: python examples/run_agent_demo.py --task "Test" --max-steps 2 --max-retries 1

      - name: Validate M4 MoE balance
        run: python -m tepid_h1.cli moe-balance-report --batch-size 4 --sequence-length 32 --steps 2 --seed 42

      - name: Validate M4 data stats
        run: python -m tepid_h1.cli corpus-stats configs/paired_corpus.example.jsonl

      - name: Validate M4 corpus isolation
        run: python -m tepid_h1.cli corpus-compare configs/paired_corpus.example.jsonl configs/validation_corpus.example.jsonl

  commit-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit message format
        run: |
          for commit in $(git log --oneline origin/main..HEAD 2>/dev/null || echo ""); do
            if [[ ! "$commit" =~ ^(feat|fix|chore|test|docs|style|refactor|ci|perf):: ]]; then
              echo "Invalid commit message: $commit"
              exit 1
            fi
          done
