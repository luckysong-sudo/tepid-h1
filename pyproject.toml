[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tepid-h1"
version = "0.2.0"
description = "Reference framework for the Tepid-H1 hybrid text and agent model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pytest>=9.1.1",
    "safetensors>=0.5,<1",
    "torch>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "flake8>=7",
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.9",
]
tokenizer-eval = [
    "tokenizers>=0.21,<1",
]

[project.scripts]
tepid-h1 = "tepid_h1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
